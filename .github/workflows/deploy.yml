name: Fineract CI/CD Pipeline

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare buildx cache
        run: |
          mkdir -p /tmp/.buildx-cache
          touch /tmp/.buildx-cache/index.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}, ${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          DB_URL: ${{ secrets.FINERACT_DB_URL }}
          DB_USER: ${{ secrets.FINERACT_DB_USER }}
          DB_PASSWORD: ${{ secrets.FINERACT_DB_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euxo pipefail
          
            # Authenticate with ECR
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REPOSITORY
          
            # Stop and remove old container if exists
            docker stop fineract || true
            docker rm fineract || true
          
            # Pull new image
            docker pull $ECR_REPOSITORY:$IMAGE_TAG
          
            # Run new container with environment variables
            docker run -d \
              --name fineract \
              --restart unless-stopped \
              --health-cmd "curl -f https://localhost:8443/actuator/health || exit 1" \
              --health-interval 30s \
              --health-timeout 10s \
              --health-retries 3 \
              -e FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.postgresql.Driver \
              -e FINERACT_HIKARI_JDBC_URL=$DB_URL \
              -e FINERACT_HIKARI_USERNAME=$DB_USER \
              -e FINERACT_HIKARI_PASSWORD=$DB_PASSWORD \
              -e SPRING_PROFILES_ACTIVE=dev \
              -p 8443:8443 \
              $ECR_REPOSITORY:$IMAGE_TAG
          
            # Clean up and verify
            docker image prune -af --filter "until=48h"
          
            # Verify deployment
            sleep 15  # Wait for application startup
            docker ps -a
            docker logs --tail 50 fineract
          EOF