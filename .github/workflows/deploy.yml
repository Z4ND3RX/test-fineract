name: Fineract CI/CD Pipeline

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare buildx cache
        run: |
          mkdir -p /tmp/.buildx-cache
          touch /tmp/.buildx-cache/index.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}, ${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Fineract to EC2 with SSL
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          APP_NAME: fineract
          FINERACT_PORT: 8443
          DOCKER_NETWORK: webapp-network
          IMAGE_TAG: ${{ github.sha }}
          DB_URL: ${{ secrets.FINERACT_DB_URL }}
          DB_USER: ${{ secrets.FINERACT_DB_USER }}
          DB_PASSWORD: ${{ secrets.FINERACT_DB_PASSWORD }}
          JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "AWS_REGION='${AWS_REGION}' \
          ECR_REPOSITORY='${ECR_REPOSITORY}' \
          APP_NAME='${APP_NAME}' \
          FINERACT_PORT='${FINERACT_PORT}' \
          DOCKER_NETWORK='${DOCKER_NETWORK}' \
          IMAGE_TAG='${IMAGE_TAG}' \
          DB_URL='${DB_URL}' \
          DB_USER='${DB_USER}' \
          DB_PASSWORD='${DB_PASSWORD}' \
          JAVA_OPTS='${JAVA_OPTS}' \
          bash -s" << 'EOSSH'
            set -euxo pipefail
            required_vars=("AWS_REGION" "ECR_REPOSITORY" "APP_NAME" "FINERACT_PORT" "DOCKER_NETWORK" "IMAGE_TAG" "DB_URL" "DB_USER" "DB_PASSWORD" "JAVA_OPTS")
            for var in "${required_vars[@]}"; do
              if [ -z "${!var}" ]; then
                echo "ERROR: Variable $var no está definida"
                exit 1
              fi
            done

            # Authenticate with ECR
            aws ecr get-login-password --region $AWS_REGION | \
              sudo docker login --username AWS --password-stdin $ECR_REPOSITORY

            # Create network if not exists
            sudo docker network inspect $DOCKER_NETWORK &>/dev/null || sudo docker network create $DOCKER_NETWORK

            # Stop and remove old container if exists
            sudo docker stop $APP_NAME || true
            sudo docker rm $APP_NAME || true

            # Pull new image with retry logic
            for i in {1..3}; do
              if sudo docker pull $ECR_REPOSITORY:$IMAGE_TAG; then
                break
              fi
              sleep 5
              echo "Retrying to pull image (attempt $i/3)..."
            done

            # Run new container with health check
            sudo docker run -d \
              --name $APP_NAME \
              --network $DOCKER_NETWORK \
              --restart unless-stopped \
              --health-cmd "curl -k -f https://localhost:$FINERACT_PORT/actuator/health || exit 1" \
              --health-interval 30s \
              --health-timeout 10s \
              --health-retries 3 \
              -e FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.postgresql.Driver \
              -e FINERACT_HIKARI_JDBC_URL=$DB_URL \
              -e FINERACT_HIKARI_USERNAME=$DB_USER \
              -e FINERACT_HIKARI_PASSWORD=$DB_PASSWORD \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e JAVA_OPTS="$JAVA_OPTS" \
              -p $FINERACT_PORT:$FINERACT_PORT \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              $ECR_REPOSITORY:$IMAGE_TAG

            # Clean up old images
            sudo docker image prune -af --filter "until=48h"
            sudo docker images | grep $ECR_REPOSITORY | tail -n +4 | awk '{print $3}' | xargs -r sudo docker rmi -f || true

            # Verify deployment
            echo "Waiting for container to start..."
            sleep 15
            sudo docker ps -a
            sudo docker inspect --format '{{json .State.Health }}' $APP_NAME
            sudo docker logs --tail 50 $APP_NAME
          EOSSH
